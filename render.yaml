# Render Blueprint — 이 파일로 백엔드 웹 서비스를 한 번에 만들 수 있어요. (Blueprints → New Blueprint Instance)
# Render 가 물어보는 값은 DATABASE_URL 하나뿐이에요. (비밀 값은 GitHub 에 올리지 않아요)
services:
  - type: web
    name: rental-backend
    runtime: node
    region: virginia        # DB 와 같은 지역 (응답이 빨라져요)
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SCHEMA
        value: hw2
      - key: JWT_SECRET
        generateValue: true  # Render 가 긴 임의 글자를 만들어 줘요
      - key: DATABASE_URL
        sync: false          # ← 배포할 때 직접 붙여 넣어요 (Render PostgreSQL 의 Internal Database URL)
      - key: CORS_ORIGIN
        # 서버를 불러도 되는 화면 주소들(쉼표로, 끝에 / 없이). Vercel 주소가 바뀌면 여기와 Render 환경변수를 함께 고쳐 주세요.
        value: https://rental-web-one-puce.vercel.app,https://rental-admin-nine.vercel.app
      - key: DEMO_RESET_ENABLED
        value: "true"
      # 챗봇(Dify)은 나중에 Render 환경변수에 DIFY_API_URL, DIFY_API_KEY 를 추가하면 켜져요. (없으면 "아직 연결되지 않았어요")
