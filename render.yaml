# Render Blueprint — 이 파일로 백엔드 웹 서비스를 한 번에 만들 수 있어요. (New → Blueprint)
# sync: false 인 값은 Render 화면에서 직접 입력해요. (비밀 값은 GitHub 에 올리지 않아요)
services:
  - type: web
    name: rental-backend
    runtime: node
    region: virginia        # DB 와 같은 지역 (응답이 빨라져요)
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SCHEMA
        value: hw2
      - key: JWT_SECRET
        generateValue: true  # Render 가 긴 임의 글자를 만들어 줘요
      - key: DATABASE_URL
        sync: false          # Render PostgreSQL 의 Internal(또는 External) Database URL
      - key: CORS_ORIGIN
        sync: false          # 예: https://rental-web.vercel.app,https://rental-admin.vercel.app
      - key: DIFY_API_URL
        sync: false          # 예: https://api.dify.ai/v1 (비워도 됨)
      - key: DIFY_API_KEY
        sync: false          # app-... (비워도 됨)
      - key: DEMO_RESET_ENABLED
        value: "true"
